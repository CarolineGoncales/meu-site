<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CPG Arcade</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:black;
font-family:Arial, Helvetica, sans-serif;
touch-action:none;
}

canvas{
display:block;
background:
radial-gradient(circle at center,
#07111f 0%,
#02040a 60%,
black 100%);
}

.ui{
position:fixed;
top:20px;
left:20px;
color:white;
z-index:10;
font-size:20px;
}

.game-over{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%, -50%);
color:white;
text-align:center;
display:none;
z-index:20;
}

.game-over h1{
font-size:60px;
margin-bottom:20px;
}

.game-over button{
padding:15px 30px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
}

/* BOTÃO TIRO MOBILE */

#shootBtn{

position:fixed;

bottom:25px;

right:20px;

width:85px;

height:85px;

border:none;

border-radius:50%;

background:#00d9ff;

color:white;

font-size:34px;

font-weight:bold;

z-index:99999;

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

box-shadow:
0 0 15px rgba(0,217,255,0.8),
0 0 30px rgba(0,217,255,0.5);

transition:0.2s;

user-select:none;

-webkit-tap-highlight-color:transparent;

}

#shootBtn:active{

transform:scale(0.92);

}

/* ESCONDER NO DESKTOP */

@media(min-width:769px){

#shootBtn{

display:none;

}

}

</style>

</head>

<body>

<div class="ui">

<div>
Pontos:
<span id="score">0</span>
</div>

<div>
Vidas:
<span id="lives">3</span>
</div>

</div>

<div class="game-over" id="gameOver">

<h1>GAME OVER</h1>

<button onclick="restartGame()">
Jogar novamente
</button>

</div>

<canvas id="game"></canvas>

<!-- BOTÃO MOBILE -->

<button id="shootBtn">🔥</button>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const scoreEl =
document.getElementById("score");

const livesEl =
document.getElementById("lives");

const gameOverScreen =
document.getElementById("gameOver");

const shootBtn =
document.getElementById("shootBtn");

let score = 0;
let lives = 3;
let gameRunning = true;

const keys = {};

window.addEventListener(
"keydown",
(e) => {
keys[e.key] = true;
}
);

window.addEventListener(
"keyup",
(e) => {
keys[e.key] = false;
}
);

class Player{

constructor(){

this.width = 60;
this.height = 60;

this.x =
canvas.width / 2 - 30;

this.y =
canvas.height - 100;

this.speed = 7;

}

update(){

if(
keys["ArrowLeft"] ||
keys["a"]
){
this.x -= this.speed;
}

if(
keys["ArrowRight"] ||
keys["d"]
){
this.x += this.speed;
}

if(this.x < 0){
this.x = 0;
}

if(
this.x + this.width >
canvas.width
){
this.x =
canvas.width - this.width;
}

}

draw(){

ctx.save();

ctx.translate(
this.x + this.width / 2,
this.y + this.height / 2
);

ctx.fillStyle = "#00d9ff";

ctx.beginPath();

ctx.moveTo(0, -30);
ctx.lineTo(25, 30);
ctx.lineTo(0, 15);
ctx.lineTo(-25, 30);

ctx.closePath();
ctx.fill();

ctx.restore();

}

}

class Bullet{

constructor(x, y){

this.x = x;
this.y = y;

this.width = 5;
this.height = 20;

this.speed = 10;

}

update(){

this.y -= this.speed;

}

draw(){

ctx.fillStyle = "#00ffcc";

ctx.fillRect(
this.x,
this.y,
this.width,
this.height
);

}

}

class Enemy{

constructor(){

this.size =
Math.random() * 40 + 30;

this.x =
Math.random() *
(canvas.width - this.size);

this.y = -this.size;

this.speed =
Math.random() * 3 + 2;

}

update(){

this.y += this.speed;

}

draw(){

ctx.fillStyle = "#ff3c6f";

ctx.beginPath();

ctx.arc(
this.x,
this.y,
this.size / 2,
0,
Math.PI * 2
);

ctx.fill();

}

}

const player = new Player();

const bullets = [];
const enemies = [];

function shoot(){

bullets.push(

new Bullet(
player.x + player.width / 2 - 2,
player.y
)

);

}

/* TIRO TECLADO */

window.addEventListener(
"keydown",

(e) => {

if(e.code === "Space"){

shoot();

}

}

);

/* TIRO MOBILE */

shootBtn.addEventListener(
"touchstart",

(e)=>{

e.preventDefault();

shoot();

}

);

shootBtn.addEventListener(
"click",

()=>{

shoot();

}

);

/* MOVIMENTO MOBILE */

window.addEventListener(
"touchmove",

(e)=>{

player.x =
e.touches[0].clientX -
player.width / 2;

}

);

function spawnEnemy(){

if(gameRunning){

enemies.push(
new Enemy()
);

}

}

setInterval(
spawnEnemy,
1000
);

function collision(a,b){

return(

a.x < b.x + b.size &&
a.x + a.width > b.x &&
a.y < b.y + b.size &&
a.y + a.height > b.y

);

}

function update(){

player.update();

bullets.forEach(
(bullet, bulletIndex) => {

bullet.update();

if(bullet.y < 0){

bullets.splice(
bulletIndex,
1
);

}

}
);

enemies.forEach(
(enemy, enemyIndex) => {

enemy.update();

if(enemy.y > canvas.height){

enemies.splice(
enemyIndex,
1
);

lives--;

livesEl.innerText = lives;

if(lives <= 0){

endGame();

}

}

bullets.forEach(
(bullet, bulletIndex) => {

if(
collision(bullet, enemy)
){

enemies.splice(
enemyIndex,
1
);

bullets.splice(
bulletIndex,
1
);

score += 10;

scoreEl.innerText = score;

}

}
);

}
);

}

function drawStars(){

for(let i = 0; i < 100; i++){

ctx.fillStyle = "white";

ctx.fillRect(

Math.random() * canvas.width,
Math.random() * canvas.height,

2,
2

);

}

}

function draw(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

drawStars();

player.draw();

bullets.forEach(
(bullet) => {
bullet.draw();
}
);

enemies.forEach(
(enemy) => {
enemy.draw();
}
);

}

function gameLoop(){

if(!gameRunning){
return;
}

update();
draw();

requestAnimationFrame(
gameLoop
);

}

function endGame(){

gameRunning = false;

gameOverScreen.style.display =
"block";

}

function restartGame(){

window.location.reload();

}

gameLoop();

window.addEventListener(
"resize",

() => {

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

);

</script>

</body>
</html>
