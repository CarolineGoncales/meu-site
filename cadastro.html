<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro - Estude Comigo CPG</title>

<link rel="stylesheet" href="style.css">

<style>

.cadastro{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:40px;

}

.cadastro-box{

background:white;

width:100%;

max-width:450px;

padding:40px;

border-radius:18px;

box-shadow:0 10px 30px rgba(0,0,0,.2);

text-align:center;

}

.cadastro-box h1{

color:#163a63;

margin-bottom:10px;

}

.cadastro-box p{

color:#555;

margin-bottom:25px;

}

.cadastro-box input{

width:100%;

padding:15px;

margin-bottom:18px;

border:1px solid #ddd;

border-radius:8px;

font-size:16px;

box-sizing:border-box;

}

.observacao{

display:block;

text-align:left;

font-size:12px;

color:#777;

margin-top:-10px;

margin-bottom:18px;

line-height:1.4;

}

.cadastro-box button{

width:100%;

padding:15px;

background:#163a63;

color:white;

border:none;

border-radius:8px;

font-size:16px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.cadastro-box button:hover{

background:#2f6cc3;

}

#mensagem{

margin-top:20px;

font-weight:bold;

color:#d62828;

}

.voltar{

display:block;

margin-top:20px;

text-decoration:none;

color:#163a63;

font-weight:bold;

}

</style>

</head>

<body>

<section class="cadastro">

<div class="cadastro-box">

<h1>📚 Criar Conta</h1>

<p>Cadastre-se para acessar o CPG Estude Comigo.</p>


<input
id="nome"
type="text"
placeholder="Nome completo"
autocomplete="name">

<small class="observacao">

* Atente-se ao nome completo. Ele será inserido em seu certificado.

</small>


<input
id="cpf"
type="text"
placeholder="CPF"
maxlength="14"
inputmode="numeric"
autocomplete="off">


<input
id="cep"
type="text"
placeholder="CEP"
maxlength="9"
inputmode="numeric"
autocomplete="postal-code">

<input
id="rua"
type="text"
placeholder="Rua"
autocomplete="street-address"
readonly>

<input
id="numero"
type="text"
placeholder="Número"
autocomplete="address-line2">

<input
id="bairro"
type="text"
placeholder="Bairro"
autocomplete="address-level3"
readonly>

<input
id="cidade"
type="text"
placeholder="Cidade"
autocomplete="address-level2"
readonly>

<input
id="estado"
type="text"
placeholder="Estado / UF"
maxlength="2"
autocomplete="address-level1"
readonly>

<input
id="complemento"
type="text"
placeholder="Complemento (opcional)"
autocomplete="address-line2">


<small class="observacao">

* Endereço completo é para informações fiscais e emissão de NF.

</small>


<input
id="email"
type="email"
placeholder="Seu e-mail"
autocomplete="email">

<input
id="senha"
type="password"
placeholder="Crie uma senha"
autocomplete="new-password">


<button onclick="cadastrar()">

Criar conta

</button>

<p id="mensagem"></p>

<a href="login.html" class="voltar">

← Já possuo uma conta

</a>

</div>

</section>


<script>

const mensagem = document.getElementById("mensagem");


document.getElementById("cpf").addEventListener(
"input",
function(){

let valor = this.value.replace(/\D/g,"");

valor = valor.substring(0,11);

valor = valor.replace(
/(\d{3})(\d)/,
"$1.$2"
);

valor = valor.replace(
/(\d{3})(\d)/,
"$1.$2"
);

valor = valor.replace(
/(\d{3})(\d{1,2})$/,
"$1-$2"
);

this.value = valor;

}
);


document.getElementById("cep").addEventListener(
"input",
function(){

let valor = this.value.replace(/\D/g,"");

valor = valor.substring(0,8);

if(valor.length > 5){

valor =
valor.substring(0,5)
+
"-"
+
valor.substring(5);

}

this.value = valor;

}
);


document.getElementById("cep").addEventListener(
"blur",
async function(){

const cep = this.value.replace(/\D/g,"");

if(cep.length !== 8){

return;

}

mensagem.textContent = "Consultando CEP...";

try{

const resposta = await fetch(
`https://viacep.com.br/ws/${cep}/json/`
);

const dados = await resposta.json();

if(dados.erro){

mensagem.textContent = "CEP não encontrado.";

return;

}

document.getElementById("rua").value =
dados.logradouro || "";

document.getElementById("bairro").value =
dados.bairro || "";

document.getElementById("cidade").value =
dados.localidade || "";

document.getElementById("estado").value =
dados.uf || "";

mensagem.textContent = "";

document.getElementById("numero").focus();

}catch(_){

mensagem.textContent =
"Não foi possível consultar o CEP.";

}

}
);


async function cadastrar(){

const nome =
document.getElementById("nome").value.trim();

const cpf =
document.getElementById("cpf").value.trim();

const cep =
document.getElementById("cep").value.trim();

const rua =
document.getElementById("rua").value.trim();

const numero =
document.getElementById("numero").value.trim();

const bairro =
document.getElementById("bairro").value.trim();

const cidade =
document.getElementById("cidade").value.trim();

const estado =
document.getElementById("estado").value.trim();

const complemento =
document.getElementById("complemento").value.trim();

const email =
document.getElementById("email").value.trim();

const senha =
document.getElementById("senha").value;


if(
nome === "" ||
cpf === "" ||
cep === "" ||
rua === "" ||
numero === "" ||
bairro === "" ||
cidade === "" ||
estado === "" ||
email === "" ||
senha === ""
){

mensagem.textContent =
"Preencha todos os campos obrigatórios.";

return;

}


if(cpf.replace(/\D/g,"").length !== 11){

mensagem.textContent =
"Digite um CPF válido.";

return;

}


if(cep.replace(/\D/g,"").length !== 8){

mensagem.textContent =
"Digite um CEP válido.";

return;

}


try{

const resposta = await fetch(
"https://cpg-estude-backend.onrender.com/cadastro",
{
method:"POST",

headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},

body:new URLSearchParams({

nome,
cpf,
cep,
rua,
numero,
bairro,
cidade,
estado,
complemento,
email,
senha

}).toString()

}
);


const dados = await resposta.json();


if(dados.mensagem){

localStorage.setItem(
"email",
email
);

window.location.href =
"assinatura.html";

}else{

mensagem.textContent =
dados.erro ||
"Não foi possível realizar o cadastro.";

}


}catch(_){

mensagem.textContent =
"Não foi possível conectar ao servidor. Tente novamente.";

}

}

</script>

</body>

</html>
